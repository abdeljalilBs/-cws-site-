<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />

  <!-- Favicon (logo dans l'onglet du navigateur) -->
  <!-- w_32 : Cloudinary redimensionne automatiquement à 32px pour un chargement instantané -->
  <link rel="icon" type="image/png"
    href="https://res.cloudinary.com/qupvgw44/image/upload/w_32/v1790343944/cws-logo-preview-white-v1.png" />
  <link rel="shortcut icon" type="image/png"
    href="https://res.cloudinary.com/qupvgw44/image/upload/w_32/v1790343944/cws-logo-preview-white-v1.png" />

  <!-- Apple Touch Icon (pour iPhone/iPad quand on ajoute le site à l'écran d'accueil) -->
  <!-- w_180 : Taille standard recommandée par Apple -->
  <link rel="apple-touch-icon"
    href="https://res.cloudinary.com/qupvgw44/image/upload/w_180/v1790343944/cws-logo-preview-white-v1.png" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description"
    content="Coach Wellness Sports — Club de sport premium à La Ville aux Dames (37). Coaching personnalisé, cours collectifs, accès 7j/7." />

  <!-- Image pour Google & Réseaux Sociaux (Open Graph / Twitter Card) -->
  <!-- w_1200 : Taille idéale pour les aperçus Facebook, LinkedIn, Twitter -->
  <meta property="og:image"
    content="https://res.cloudinary.com/qupvgw44/image/upload/w_1200/v1790343944/cws-logo-preview-white-v1.png" />
  <meta property="og:title" content="Coach Wellness Sports — Club de sport premium" />
  <meta property="og:description"
    content="Club de sport premium à La Ville aux Dames (37). Coaching personnalisé, cours collectifs, accès 7j/7." />
  <meta name="twitter:image"
    content="https://res.cloudinary.com/qupvgw44/image/upload/w_1200/v1790343944/cws-logo-preview-white-v1.png" />

  <!-- Données structurées Google (Logo officiel du club pour le SEO) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SportsClub",
      "name": "Coach Wellness Sports",
      "url": "https://www.coach-wellness-sports.com",
      "logo": "https://res.cloudinary.com/qupvgw44/image/upload/w_500/v1790343944/cws-logo-preview-white-v1.png",
      "image": "https://res.cloudinary.com/qupvgw44/image/upload/w_1200/v1790343944/cws-logo-preview-white-v1.png"
    }
    </script>

  <!-- Titre par défaut (sera changé dynamiquement par React via PageTitle.jsx) -->
  <title>Coach Wellness Sports — Salle de sport premium</title>

  <!-- Typo Anton (pour tes titres stylisés) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
